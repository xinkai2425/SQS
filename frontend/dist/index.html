    <script>
      // 在页面加载前同步设置主题，避免闪烁
      (function() {
        const saved = localStorage.getItem('theme');
        const theme = saved === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="color-scheme"]').content = theme;
      })();
    </script>
